
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game-container">

    <h1>Rock Paper Scissors</h1>

    <div class="scoreboard">
      <div class="score-box">
        <span id="player-score">0</span>
        <p>You</p>
      </div>

      <div class="score-box">
        <span id="computer-score">0</span>
        <p>Computer</p>
      </div>

      <div class="score-box">
        <span id="draw-score">0</span>
        <p>Ties</p>
      </div>
    </div>

    <div class="game-message">
      <p id="result">Choose your move to start playing!</p>
    </div>

    <p>Your Choice: <span id="user-choice"></span></p>
    <p>Computer Choice: <span id="computer-choice"></span></p>

    <div class="choices">
      <button id="rock">✊ Rock</button>
      <button id="paper">✋ Paper</button>
      <button id="scissors">✌️ Scissors</button>
    </div>

    <button id="reset" class="reset-button">
      ↺ Reset scores
    </button>

  </main>

  <script src="app.js"></script>
</body>
</html>
